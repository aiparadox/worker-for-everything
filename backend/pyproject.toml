[project]
name = "qfe"
version = "0.1.0"
description = "Queue for everything: a generic queue-based job server"
authors = [
    { name = "aiparadox", email = "getreadyforai@gmail.com" }
]
requires-python = ">=3.12,<3.13"
# No dependency is added by FEAT-20261010-1201. The approved list is installed
# by FEAT-20261010-1208 (docs/specs/FEAT-20261010-1208-dependencies.md).
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# Tool settings (D45). The tools themselves are installed by FEAT-20261010-1208.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["qfe"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
